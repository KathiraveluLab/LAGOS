version: '3.8'

services:
  nats-mesh:
    image: nats:latest
    container_name: lagos-nats-mesh
    ports:
      - "4222:4222"
    networks:
      - lagos-mesh

  anchorage-gateway:
    image: ubuntu:24.04
    container_name: anchorage-gateway
    command: >
      bash -c "apt-get update && apt-get install -y iperf3 iproute2 mptcpize &&
      sleep infinity"
    networks:
      - lagos-mesh
    cap_add:
      - NET_ADMIN
    privileged: true

  pula-gateway:
    image: ubuntu:24.04
    container_name: pula-gateway
    command: >
      bash -c "apt-get update && apt-get install -y iperf3 iproute2 mptcpize &&
      iperf3 -s -p 5201"
    networks:
      - lagos-mesh
    cap_add:
      - NET_ADMIN
    privileged: true

  tokyo-cloud:
    image: ubuntu:24.04
    container_name: tokyo-cloud
    command: >
      bash -c "apt-get update && apt-get install -y iperf3 iproute2 mptcpize &&
      sleep infinity"
    networks:
      - lagos-mesh
    cap_add:
      - NET_ADMIN
    privileged: true

networks:
  lagos-mesh:
    driver: bridge
